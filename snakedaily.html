<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Snake</title>
<style>
:root{--bg:#f4f1ea;--fg:#1d1d1b;--cell:#e9e4d8;--wall:#3a3a38;--snake:#2f7d4f;--head:#1d5c37;--food:#d2452f;--btn:#fff;--bd:#cfc8b8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151513;--fg:#ecebe6;--cell:#222220;--wall:#6b6b66;--snake:#58b97c;--head:#8fe0a9;--food:#ff6a52;--btn:#2a2a27;--bd:#3d3d39}}
:root[data-theme="dark"]{--bg:#151513;--fg:#ecebe6;--cell:#222220;--wall:#6b6b66;--snake:#58b97c;--head:#8fe0a9;--food:#ff6a52;--btn:#2a2a27;--bd:#3d3d39}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:480px;margin:0 auto;padding:16px;text-align:center}
h1{font-size:1.3rem;margin:4px 0}
.meta{font-size:.85rem;opacity:.75;margin-bottom:10px}
.bar{display:flex;justify-content:space-between;font-weight:600;margin-bottom:8px}
.wrap{position:relative}
canvas{width:100%;display:block;border-radius:8px;touch-action:none}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);color:#fff;border-radius:8px;font-weight:600;white-space:pre-line;padding:16px;cursor:pointer}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center;margin-top:12px}
.pad button{height:52px;font-size:1.3rem;border:1px solid var(--bd);background:var(--btn);color:var(--fg);border-radius:10px}
</style>
</head>
<body>
<main>
<h1>Daily Snake</h1>
<div class="meta" id="meta"></div>
<div class="bar"><span>Score: <span id="s">0</span></span><span>Best today: <span id="b">0</span></span></div>
<div class="wrap"><canvas id="c" width="480" height="480"></canvas><div id="msg">Tap or press an arrow key to start</div></div>
<div class="pad">
<span></span><button data-d="0,-1">▲</button><span></span>
<button data-d="-1,0">◀</button><button data-d="0,1">▼</button><button data-d="1,0">▶</button>
</div>
</main>
<script>
const N=20, C=24;
const cv=document.getElementById('c'), ctx=cv.getContext('2d'), msg=document.getElementById('msg');

// Seeded random: same seed -> same sequence for everyone
function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const d=new Date();
const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

function makeLevel(key){
  for(let attempt=0;;attempt++){
    const r=rng(hash(key+':'+attempt));
    const walls=new Set();
    const n=5+Math.floor(r()*5);
    for(let i=0;i<n;i++){
      const horiz=r()<.5, len=3+Math.floor(r()*6);
      const x=Math.floor(r()*N), y=Math.floor(r()*N);
      for(let k=0;k<len;k++){
        const cx=horiz?x+k:x, cy=horiz?y:y+k;
        if(cx<N&&cy<N&&!(Math.abs(cx-10)<=4&&Math.abs(cy-10)<=2)) walls.add(cy*N+cx);
      }
    }
    // Flood fill: every open cell must be reachable from the start
    const seen=new Set([10*N+10]), q=[[10,10]];
    while(q.length){
      const [x,y]=q.pop();
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=x+dx, ny=y+dy, id=ny*N+nx;
        if(nx<0||ny<0||nx>=N||ny>=N||walls.has(id)||seen.has(id)) continue;
        seen.add(id); q.push([nx,ny]);
      }
    }
    if(seen.size===N*N-walls.size) return {walls,attempt,rand:r};
  }
}
const level=makeLevel(key);
document.getElementById('meta').textContent=key+' · '+level.walls.size+' wall blocks · same layout for everyone today';

let snake,dir,next,food,score,alive,running,timer;
const bestKey='snake-best-'+key;
let best=0; try{best=+localStorage.getItem(bestKey)||0}catch(e){}
document.getElementById('b').textContent=best;

function placeFood(){
  const free=[];
  for(let i=0;i<N*N;i++){ if(!level.walls.has(i)&&!snake.some(p=>p[1]*N+p[0]===i)) free.push(i); }
  const i=free[Math.floor(Math.random()*free.length)];
  food=[i%N, Math.floor(i/N)];
}
function reset(){
  snake=[[10,10],[9,10],[8,10]]; dir=[1,0]; next=[1,0]; score=0; alive=true; running=false;
  document.getElementById('s').textContent=0; placeFood(); draw(); clearInterval(timer);
}
function start(){ if(!alive) reset(); if(running) return; running=true; msg.style.display='none'; timer=setInterval(tick,120); }
function setDir(dx,dy){
  if(dx===-dir[0]&&dy===-dir[1]) return; // no instant reverse
  next=[dx,dy]; start();
}
function tick(){
  dir=next;
  const h=[snake[0][0]+dir[0], snake[0][1]+dir[1]];
  const hit=h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||level.walls.has(h[1]*N+h[0])||snake.some(p=>p[0]===h[0]&&p[1]===h[1]);
  if(hit){ return over(); }
  snake.unshift(h);
  if(h[0]===food[0]&&h[1]===food[1]){
    score++; document.getElementById('s').textContent=score; placeFood();
  } else snake.pop();
  draw();
}
function over(){
  alive=false; running=false; clearInterval(timer);
  if(score>best){ best=score; document.getElementById('b').textContent=best; try{localStorage.setItem(bestKey,best)}catch(e){} }
  msg.textContent='Game over · score '+score+'\nTap to play again'; msg.style.display='flex';
}
function draw(){
  const cs=getComputedStyle(document.documentElement);
  ctx.fillStyle=cs.getPropertyValue('--cell'); ctx.fillRect(0,0,N*C,N*C);
  ctx.fillStyle=cs.getPropertyValue('--wall');
  level.walls.forEach(i=>ctx.fillRect((i%N)*C,Math.floor(i/N)*C,C,C));
  ctx.fillStyle=cs.getPropertyValue('--food');
  ctx.beginPath(); ctx.arc(food[0]*C+C/2,food[1]*C+C/2,C/2-3,0,7); ctx.fill();
  snake.forEach((p,i)=>{ ctx.fillStyle=cs.getPropertyValue(i?'--snake':'--head'); ctx.fillRect(p[0]*C+1,p[1]*C+1,C-2,C-2); });
}

// Input: keyboard, d-pad buttons, swipe
addEventListener('keydown',e=>{
  const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];
  if(m){ e.preventDefault(); setDir(...m); }
});
document.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>setDir(...b.dataset.d.split(',').map(Number)));
let t0=null;
cv.addEventListener('touchstart',e=>{t0=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});
cv.addEventListener('touchend',e=>{
  if(!t0) return;
  const dx=e.changedTouches[0].clientX-t0[0], dy=e.changedTouches[0].clientY-t0[1];
  if(Math.max(Math.abs(dx),Math.abs(dy))>20){ Math.abs(dx)>Math.abs(dy)?setDir(Math.sign(dx),0):setDir(0,Math.sign(dy)); }
  t0=null;
});
msg.onclick=()=>{ if(!alive) reset(); msg.style.display='none'; start(); };
reset();
</script>
</body>
</html>
